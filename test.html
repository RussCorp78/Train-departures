<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="stylesheet" href="style.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Departures Board </title>
  
<style>

/* =========================================================
   BASIC PAGE
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

  background: #000;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: #fff;
}


/* =========================================================
   PAGE
   ========================================================= */

body {
  padding: 20px;
}


/* =========================================================
   BOARD
   ========================================================= */

.board {

  width: 100%;
  max-width: 900px;

  margin: 0 auto;

  background: #000;

  border: 2px solid #333;

  overflow: hidden;
}


/* =========================================================
   TITLE
   ========================================================= */

.board-title {

  background: #111;

  color: #fff;

  font-size: 26px;
  font-weight: bold;

  padding: 15px 18px;

  border-bottom: 2px solid #333;
}


/* =========================================================
   COLUMN HEADINGS
   ========================================================= */

.column-headings {

  display: grid;

  grid-template-columns:
    75px
    minmax(0, 1fr)
    65px
    105px;

  background: #181818;

  color: #aaa;

  font-size: 13px;
  font-weight: bold;

  padding: 8px 10px;

  border-bottom: 1px solid #333;
}


/* =========================================================
   TRAIN
   ========================================================= */

.train {

  border-bottom: 1px solid #333;

  cursor: pointer;

  transition:
    background 0.15s ease;
}

.train:hover {

  background: #151515;
}


/* =========================================================
   MAIN TRAIN ROW
   ========================================================= */

.train-main {

  display: grid;

  grid-template-columns:
    75px
    minmax(0, 1fr)
    65px
    105px;

  align-items: center;

  min-height: 55px;

  padding: 8px 10px;
}


/* =========================================================
   CELLS
   ========================================================= */

.time {

  font-size: 21px;

  font-weight: bold;

  color: #fff;
}


.destination {

  min-width: 0;

  font-size: 19px;

  font-weight: bold;

  color: #fff;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.platform {

  text-align: center;

  font-size: 19px;

  font-weight: bold;

  color: #fff;
}


.expected {

  text-align: right;

  font-size: 16px;

  color: #fff;
}


/* =========================================================
   EXPECTED STATUS
   ========================================================= */

.expected.delayed {

  color: #ffb000;
}

.expected.cancelled {

  color: #ff3333;
}


/* =========================================================
   CALLING POINTS
   ========================================================= */

.details {

  height: 32px;

  overflow: hidden;

  background: #050505;

  border-top: 1px solid #181818;

  color: #999;

  font-size: 13px;

  white-space: nowrap;

  display: flex;

  align-items: center;
}


.scrolling {

  display: inline-block;

  padding-left: 100%;

  animation:
    scrollText linear infinite;
}


@keyframes scrollText {

  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-100%);
  }

}


/* =========================================================
   CLICK HINT
   ========================================================= */

.click-hint {

  text-align: center;

  color: #777;

  font-size: 12px;

  padding: 10px;

  border-bottom: 1px solid #222;
}


/* =========================================================
   BACK LINK
   ========================================================= */

.back {

  display: block;

  max-width: 900px;

  margin: 15px auto 0;

  color: #aaa;

  text-decoration: none;

  font-size: 15px;
}

.back:hover {

  color: #fff;
}


/* =========================================================
   MAP OVERLAY
   ========================================================= */

#mapOverlay {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 1000;

  background: rgba(0, 0, 0, 0.92);

  padding: 15px;
}


/* =========================================================
   MAP WINDOW
   ========================================================= */

.map-window {

  width: 100%;
  height: 100%;

  max-width: 1000px;

  margin: 0 auto;

  background: #111;

  border: 2px solid #444;

  display: flex;

  flex-direction: column;

  overflow: hidden;
}


/* =========================================================
   MAP HEADER
   ========================================================= */

.map-header {

  min-height: 70px;

  background: #111;

  padding: 12px 15px;

  border-bottom: 2px solid #333;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;
}


.map-title {

  min-width: 0;
}


.map-title-main {

  font-size: 19px;

  font-weight: bold;

  color: #fff;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.map-status {

  margin-top: 4px;

  font-size: 13px;

  color: #aaa;
}


.close-map {

  flex-shrink: 0;

  background: #222;

  border: 1px solid #555;

  color: #fff;

  font-size: 16px;

  padding: 8px 12px;

  cursor: pointer;
}

.close-map:hover {

  background: #333;
}


/* =========================================================
   MAP
   ========================================================= */

#trainMap {

  width: 100%;

  flex: 1;

  border: 0;

  background: #222;
}


/* =========================================================
   MAP FOOTER
   ========================================================= */

.map-footer {

  min-height: 42px;

  background: #111;

  border-top: 1px solid #333;

  padding: 8px 12px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  font-size: 12px;

  color: #888;
}


.map-footer a {

  color: #aaa;

  text-decoration: none;
}

.map-footer a:hover {

  color: #fff;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

  body {
    padding: 8px;
  }

  .board-title {
    font-size: 21px;
  }

  .column-headings,
  .train-main {

    grid-template-columns:
      62px
      minmax(0, 1fr)
      50px
      85px;

  }

  .time {
    font-size: 18px;
  }

  .destination {
    font-size: 16px;
  }

  .platform {
    font-size: 17px;
  }

  .expected {
    font-size: 13px;
  }

  #mapOverlay {
    padding: 0;
  }

  .map-window {
    border: 0;
  }

}


/* =========================================================
   MAP LOADING
   ========================================================= */

.map-loading {

  display: flex;

  align-items: center;

  justify-content: center;

  height: 100%;

  color: #aaa;

  font-size: 16px;
}
/* =========================================================
   STATION SELECTOR
   ========================================================= */

.station-selector {

  width: 100%;
  max-width: 900px;

  margin: 0 auto 15px;

  position: relative;
}


.station-selector label {

  display: block;

  color: #aaa;

  font-size: 13px;
  font-weight: bold;

  margin-bottom: 6px;
}


/* ---------------------------------------------------------
   SEARCH BOX
   --------------------------------------------------------- */

.station-search {

  position: relative;

  width: 100%;
}


#stationInput {

  width: 100%;

  padding: 12px 45px 12px 14px;

  background: #111;

  border: 2px solid #444;

  border-radius: 4px;

  color: #fff;

  font-size: 17px;

  outline: none;
}


#stationInput:focus {

  border-color: #777;
}


#stationInput::placeholder {

  color: #777;
}


/* ---------------------------------------------------------
   CLEAR BUTTON
   --------------------------------------------------------- */

#clearStation {

  position: absolute;

  right: 8px;
  top: 50%;

  transform: translateY(-50%);

  width: 30px;
  height: 30px;

  border: 0;

  background: transparent;

  color: #888;

  font-size: 24px;

  line-height: 28px;

  cursor: pointer;

  display: none;
}


#clearStation:hover {

  color: #fff;
}


/* ---------------------------------------------------------
   SUGGESTIONS
   --------------------------------------------------------- */

.station-suggestions {

  position: absolute;

  left: 0;
  right: 0;

  top: 100%;

  z-index: 500;

  background: #111;

  border: 2px solid #444;

  border-top: 0;

  max-height: 300px;

  overflow-y: auto;

  display: none;
}


.station-suggestion {

  padding: 12px 14px;

  border-bottom: 1px solid #333;

  cursor: pointer;

  color: #fff;

  font-size: 16px;
}


.station-suggestion:last-child {

  border-bottom: 0;
}


.station-suggestion:hover,
.station-suggestion.active {

  background: #222;
}


.station-code {

  color: #888;

  font-size: 13px;

  margin-left: 8px;
}


/* ---------------------------------------------------------
   STATUS
   --------------------------------------------------------- */

.station-status {

  margin-top: 5px;

  color: #777;

  font-size: 12px;
}
  
</style>

</head>


<body>

<!-- =======================================================
     STATION SELECTOR
     ======================================================= -->

<div class="station-selector">

  <label for="stationInput">
    Station
  </label>

  <div class="station-search">

    <input
      type="text"
      id="stationInput"
      placeholder="Search for a station..."
      autocomplete="off"
      spellcheck="false"
    >

    <button
      id="clearStation"
      type="button"
      aria-label="Clear station"
    >
      ×
    </button>

  </div>

  <div
    id="stationSuggestions"
    class="station-suggestions"
  ></div>

  <div
    id="stationStatus"
    class="station-status"
  >
    Loading stations...
  </div>

</div>

<div class="mode-selector">
  <button id="modeBtn">
    Show Arrivals
  </button>
</div>
  
  
<!-- =======================================================
     DEPARTURE BOARD
     ======================================================= -->

<div class="board">

  <div class="board-title">
    <h1 id="stationTitle">Sheffield Departures</h1>
  </div>


  <div class="column-headings">
    <div id="timeHeading">Dep</div>
    <div id="placeHeading">Destination</div>
    <div>Plat</div>
    <div style="text-align:right;">Expected</div>
  </div>


  <div class="click-hint">
    Tap a train to see its live location
  </div>


  <div id="departures">
    Loading departures...
  </div>

</div>


<a
  class="back"
  href="index.html"
>
  ← Back
</a>



<!-- =======================================================
     MAP OVERLAY
     ======================================================= -->

<div id="mapOverlay">

  <div class="map-window">


    <div class="map-header">

      <div class="map-title">

        <div
          id="mapTitle"
          class="map-title-main"
        >
          Train location
        </div>

        <div
          id="mapStatus"
          class="map-status"
        >
          Finding train...
        </div>

      </div>


      <button
        id="closeMap"
        class="close-map"
      >
        Close
      </button>

    </div>


    <iframe
      id="trainMap"
      title="Train location map"
      src="about:blank"
      loading="lazy"
    ></iframe>


    <div class="map-footer">

      <span id="lastUpdated">
        Waiting for position...
      </span>

      <a
        id="openMap"
        href="#"
        target="_blank"
        rel="noopener"
      >
        Open map
      </a>

    </div>

  </div>

</div>



<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

/* Cloudflare Worker link */
  
  const CLOUDFLARE_URL = "https://falling-scene-1424.paul-russell.workers.dev";

/* Initial station selection */  

  let STATION = "SHF";

/* How often to update the train position while the map is open.  60 seconds = 1 request per minute */

  const POSITION_REFRESH_INTERVAL = 60 * 1000;

/* How many departures to display */

  const NUMBER_OF_DEPARTURES = 10;

/* Timer used only while the map is open */

  let positionTimer = null;

/* Currently selected train.  This contains the traini.ac train_id/headcode */

  let selectedTrain = null;

/* Prevent overlapping position requests */

  let updatingPosition = false;

/* Arrival or departure variable */

  let BOARD_MODE = "departures";

/* =========================================================
   STATION SELECTION
   ========================================================= */

let stations = [];

const stationInput =
  document.getElementById("stationInput");

const stationSuggestions =
  document.getElementById(
    "stationSuggestions"
  );

const stationStatus =
  document.getElementById(
    "stationStatus"
  );

const clearStation =
  document.getElementById(
    "clearStation"
  );


/* =========================================================
   LOAD STATIONS
   ========================================================= */

async function loadStations() {

  try {

    const response =
      await fetch("stations.json");

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );
    }


    stations =
      await response.json();


    if (!Array.isArray(stations)) {

      throw new Error(
        "stations.json is not an array."
      );
    }


    stationStatus.textContent =
      `${stations.length} stations available`;


    /*
    Show the currently selected station.
    */

    const currentStation =
      stations.find(station => station.station_code === STATION
      );
    if (currentStation) {
      stationInput.value = currentStation.station_name;

      document.getElementById("stationTitle").textContent =
        `${currentStation.station_name} Departures (${currentStation.station_code})`;
    }


  } catch (error) {

    console.error(
      "Could not load stations:",
      error
    );


    stationStatus.textContent =
      "Could not load stations.";
  }
}



/* =========================================================
   SEARCH STATIONS
   ========================================================= */

function searchStations(
  searchText
) {

  const query =
    searchText
      .trim()
      .toLowerCase();


  if (!query) {

    stationSuggestions.style.display =
      "none";

    return;
  }


  /*
  Match anywhere in the station name.

  So:

  "sheff"
  "field"
  "effie"

  could all find Sheffield.
  */

  const matches =
    stations
      .filter(station =>
        station.station_name
          .toLowerCase()
          .includes(query)
      )
      .slice(0, 20);


  stationSuggestions.innerHTML =
    "";


  if (matches.length === 0) {

    stationSuggestions.innerHTML =
      `<div class="station-suggestion">
        No stations found
      </div>`;

    stationSuggestions.style.display =
      "block";

    return;
  }


  matches.forEach(
    station => {

      const item =
        document.createElement("div");

      item.className =
        "station-suggestion";


      item.innerHTML = `
        ${escapeHtml(station.station_name)}
        <span class="station-code">
          ${escapeHtml(station.station_code)}
        </span>
      `;


      item.addEventListener(
        "click",
        () => {

          selectStation(
            station
          );

        }
      );


      stationSuggestions.appendChild(
        item
      );

    }
  );


  stationSuggestions.style.display =
    "block";
}



/* =========================================================
   SELECT STATION
   ========================================================= */

function selectStation(station) {
  /* THIS is where STATION changes*/
  STATION = station.station_code;
  stationInput.value = station.station_name;
  document.getElementById("stationTitle").textContent =
  `${station.station_name} ${
    BOARD_MODE === "departures"
      ? "Departures"
      : "Arrivals"
  } (${station.station_code})`;
  stationSuggestions.style.display = "none";
  stationStatus.textContent = `${station.station_name} (${station.station_code})`;
  clearStation.style.display = "block";
  loadDepartures(); /* Reload the departure board using the newly selected station. */
}



/* =========================================================
   INPUT EVENT
   ========================================================= */

stationInput.addEventListener(
  "input",
  () => {

    clearStation.style.display =
      stationInput.value
        ? "block"
        : "none";


    searchStations(
      stationInput.value
    );

  }
);



/* =========================================================
   CLEAR STATION
   ========================================================= */

clearStation.addEventListener(
  "click",
  () => {

    stationInput.value =
      "";

    STATION =
      "";

    stationSuggestions.style.display =
      "none";

    stationStatus.textContent =
      "Search for a station.";

    clearStation.style.display =
      "none";

  }
);

  /* Arrival departure switch event */
  
document
  .getElementById("modeBtn")
  .addEventListener("click", () => {

    BOARD_MODE = BOARD_MODE === "departures"
        ? "arrivals"
        : "departures";

    document.getElementById("modeBtn").textContent = BOARD_MODE === "departures"
        ? "Show Arrivals"
        : "Show Departures";
    
    document.getElementById("timeHeading").textContent = BOARD_MODE === "departures"
        ? "Dep"
        : "Arr";
 
    document.getElementById("placeHeading").textContent = BOARD_MODE === "departures"
        ? "Destination"
        : "From";
 
  const currentStation = 
    stations.find(
    station =>
    station.station_code === STATION
  );
 
  if (currentStation) {
 
    document.getElementById("stationTitle").textContent =
      `${currentStation.station_name} ${
      BOARD_MODE === "departures"
        ? "Departures"
        : "Arrivals"
      } (${currentStation.station_code})`;
  }
 
loadDepartures();
 
});

/* =========================================================
   CLOSE SUGGESTIONS WHEN CLICKING ELSEWHERE
   ========================================================= */

document.addEventListener(
  "click",
  event => {

    if (
      !event.target.closest(
        ".station-selector"
      )
    ) {

      stationSuggestions.style.display =
        "none";
    }

  }
);



/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  const div =
    document.createElement("div");

  div.textContent =
    value;

  return div.innerHTML;
}

/* =========================================================
   LOAD DEPARTURES
   ========================================================= */

async function loadDepartures() {

  const container =
    document.getElementById("departures");


  try {

    const response =
      await fetch(
        `${CLOUDFLARE_URL}?type=train&station=${encodeURIComponent(STATION)}&board=${BOARD_MODE}`
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();

    console.log(data);

    const services =
      BOARD_MODE === "departures"
      ? data.departures
      : data.arrivals;

    if (
      !services ||
      !Array.isArray(services)
    )
{

      container.innerHTML =
        `<div style="padding:20px;">
          No services found.
        </div>`;

      return;
    }


    container.innerHTML = "";


     const departures =
      services.slice(
        0,
        NUMBER_OF_DEPARTURES
      );

    for (const train of departures) {

      await createTrain(
        train,
        container
      );

    }


  } catch (error) {

    console.error(
      "Departure loading error:",
      error
    );


    container.innerHTML =
      `<div style="padding:20px;color:#ff5555;">
        Could not load departures.
      </div>`;
  }
}



/* =========================================================
   CREATE TRAIN ROW
   ========================================================= */

async function createTrain(
  train,
  container
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "train";


  /* -------------------------------------------------------
     Main row
     ------------------------------------------------------- */

  const main =
    document.createElement("div");

  main.className =
    "train-main";


  /* -------------------------------------------------------
     Departure time
     ------------------------------------------------------- */

  const time = document.createElement("div");

  time.className = "time";

  time.textContent = train.scheduled || "--:--";


  /* -------------------------------------------------------
     Destination
     ------------------------------------------------------- */

  const destination = document.createElement("div");

  destination.className = "destination";

  destination.textContent =
  BOARD_MODE === "departures"
    ? train.destination || "Unknown"
    : train.origin || "Unknown";

  /* -------------------------------------------------------
     Platform
     ------------------------------------------------------- */

    const platform = document.createElement("div");

    platform.className = "platform";

    platform.textContent = train.platform || "--";

  /* -------------------------------------------------------
     Expected
     ------------------------------------------------------- */

    const expected = document.createElement("div");
    expected.className = "expected";

    const expectedText = train.expected || "On time";
    expected.textContent = expectedText;

  /* Colour delayed/cancelled services */

  if (
    train.is_cancelled ||
    /cancel/i.test(expectedText)
  ) {

    expected.classList.add(
      "cancelled"
    );

  } else if (
    !/on time/i.test(expectedText)
  ) {

    expected.classList.add(
      "delayed"
    );
  }


  main.appendChild(time);
  main.appendChild(destination);
  main.appendChild(platform);
  main.appendChild(expected);


  /* -------------------------------------------------------
     Calling points
     ------------------------------------------------------- */

  const details =
    document.createElement("div");

  details.className =
    "details";


  const scrolling =
    document.createElement("div");

  scrolling.className =
    "scrolling";


  /*
  Fetch calling points using the existing
  Buses & Trains service endpoint.

  This is the same functionality your current board
  already uses.
  */

  if (train.service_id) {

    try {

      const response =
        await fetch(
          `${CLOUDFLARE_URL}?type=service&service=${encodeURIComponent(train.service_id)}`
        );


      if (response.ok) {

        const service =
          await response.json();


        const callingPoints =
          Array.isArray(
            service.calling_points
          )
            ? service.calling_points
            : [];


        const names =
          callingPoints
            .map(point =>
              point.station_name
            )
            .filter(Boolean);


        /*
        Add destination if it isn't already
        the last calling point.
        */

        if (
          train.destination &&
          (
            names.length === 0 ||
            names[names.length - 1] !==
              train.destination
          )
        ) {

          names.push(
            train.destination
          );
        }


        if (names.length > 0) {

          const text =
            names.join(
              "  →  "
            );


          scrolling.textContent =
            text;


          /*
          Longer text gets more time.
          */

          const duration =
            Math.max(
              12,
              text.length * 0.18
            );


          scrolling.style.animationDuration =
            `${duration}s`;

        } else {

          scrolling.textContent =
            train.destination || "";

        }

      } else {

        scrolling.textContent =
          train.destination || "";

      }

    } catch {

      scrolling.textContent =
        train.destination || "";
    }

  } else {

    scrolling.textContent =
      train.destination || "";
  }


  details.appendChild(
    scrolling
  );


  wrapper.appendChild(
    main
  );

  wrapper.appendChild(
    details
  );


  /*
  ==========================================================
  CLICK EVENT
  ==========================================================
  */

  wrapper.addEventListener(
    "click",
    () => {

      openTrainMap(train);

    }
  );


  container.appendChild(
    wrapper
  );
}



/* =========================================================
   OPEN TRAIN MAP
   ========================================================= */

async function openTrainMap(
  departure
) {

  /*
  Stop any existing timer first.
  */

  stopPositionUpdates();


  selectedTrain = null;


  /*
  Show map window.
  */

  const overlay =
    document.getElementById(
      "mapOverlay"
    );


  overlay.style.display =
    "block";


  document.body.style.overflow =
    "hidden";


  /*
  Set title.
  */

  document.getElementById(
    "mapTitle"
  ).textContent =
    `${departure.scheduled || ""} ${departure.destination || ""}`;


  setMapStatus(
    "Finding this train..."
  );


  document.getElementById(
    "lastUpdated"
  ).textContent =
    "Searching for live position...";


  document.getElementById(
    "trainMap"
  ).src =
    "about:blank";


  /*
  Cancelled trains don't need a live search.
  */

  if (departure.is_cancelled) {

    setMapStatus(
      "This train is cancelled."
    );

    document.getElementById(
      "lastUpdated"
    ).textContent =
      "No live position available.";

    return;
  }


  try {

    /*
    Ask the Worker to match this Buses & Trains
    departure against traini.ac.
    */

    const params =
  new URLSearchParams({

    type:
      "find-train",

    station:
      STATION,

    time:
      departure.scheduled || "",

    destination:
      departure.destination || "",

    origin:
      departure.origin || "",

    operator:
      departure.operator || ""

  });


    const response =
      await fetch(
        `${CLOUDFLARE_URL}?${params.toString()}`
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }


    /*
    No match.
    */

    if (!data.found) {

      console.log(
        "Train matching result:",
        data
      );


      setMapStatus(
        "Live train could not be identified."
      );


      document.getElementById(
        "lastUpdated"
      ).textContent =
        data.reason ||
        "No matching live train was found.";

      return;
    }


    /*
    Save train identifier for subsequent
    60-second updates.
    */

    selectedTrain = {

      train_id:
        data.match.train_id,

      headcode:
        data.match.headcode

    };


    /*
    Update the information.
    */

    if (data.match.status_text) {

      setMapStatus(
        data.match.status_text
      );

    } else if (
      data.match.lateness_minutes !== null &&
      data.match.lateness_minutes !== undefined
    ) {

      setMapStatus(
        `${data.match.lateness_minutes} minutes late`
      );

    } else {

      setMapStatus(
        "Train identified"
      );
    }


    /*
    If we already got a position as part of
    the initial request, display it immediately.
    */

    if (data.position) {

      showTrainPosition(
        data.position
      );

    } else {

      /*
      The train has been identified but there
      isn't currently a usable map position.

      This can happen before the train starts
      generating movement reports, or if its
      latest report doesn't have coordinates.
      */

      setMapStatus(
        "Train identified — waiting for live position..."
      );


      document.getElementById(
        "lastUpdated"
      ).textContent =
        "No current map position available.";
    }


    /*
    Start position polling only after the
    map has been opened and a train identified.
    */

    startPositionUpdates();


  } catch (error) {

    console.error(
      "Train map error:",
      error
    );


    setMapStatus(
      "Could not find live train information."
    );


    document.getElementById(
      "lastUpdated"
    ).textContent =
      error.message ||
      "Unknown error.";
  }
}



/* =========================================================
   SET MAP STATUS
   ========================================================= */

function setMapStatus(
  text
) {

  document.getElementById(
    "mapStatus"
  ).textContent =
    text;
}



/* =========================================================
   START POSITION UPDATES
   ========================================================= */

function startPositionUpdates() {

  stopPositionUpdates();


  /*
  Update every 60 seconds while map is open.
  */

  positionTimer =
    setInterval(
      updateTrainPosition,
      POSITION_REFRESH_INTERVAL
    );
}



/* =========================================================
   STOP POSITION UPDATES
   ========================================================= */

function stopPositionUpdates() {

  if (positionTimer) {

    clearInterval(
      positionTimer
    );

    positionTimer =
      null;
  }
}



/* =========================================================
   UPDATE TRAIN POSITION
   ========================================================= */

async function updateTrainPosition() {

  /*
  Don't send another request if the previous
  one hasn't finished.
  */

  if (
    updatingPosition ||
    !selectedTrain
  ) {

    return;
  }


  updatingPosition =
    true;


  try {

    const params =
      new URLSearchParams({

        type:
          "live-train"

      });


    if (
      selectedTrain.train_id
    ) {

      params.set(
        "train_id",
        selectedTrain.train_id
      );
    }


    if (
      selectedTrain.headcode
    ) {

      params.set(
        "headcode",
        selectedTrain.headcode
      );
    }


    const response =
      await fetch(
        `${CLOUDFLARE_URL}?${params.toString()}`
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }


    if (data.position) {

      showTrainPosition(
        data.position
      );

    } else {

      document.getElementById(
        "lastUpdated"
      ).textContent =
        "No new map position available.";
    }


    /*
    Update status from train data if available.
    */

    const trainResult =
      data.train?.results?.[0];


    if (trainResult) {

      if (
        trainResult.variation_status
      ) {

        let status =
          trainResult.variation_status;


        if (
          trainResult.lateness_minutes !==
          null &&
          trainResult.lateness_minutes !==
          undefined
        ) {

          status +=
            ` — ${trainResult.lateness_minutes} min`;
        }


        setMapStatus(
          status
        );
      }
    }


  } catch (error) {

    console.error(
      "Position update error:",
      error
    );


    document.getElementById(
      "lastUpdated"
    ).textContent =
      "Position update failed.";


  } finally {

    updatingPosition =
      false;
  }
}



/* =========================================================
   SHOW TRAIN POSITION
   ========================================================= */

function showTrainPosition(
  position
) {

  if (
    !position ||
    typeof position.lat !== "number" ||
    typeof position.lon !== "number"
  ) {

    return;
  }


  const lat =
    position.lat;

  const lon =
    position.lon;


  /*
  Create a sensible map area around the train.

  Approximately 15 km east/west and 10 km
  north/south at Sheffield's latitude.
  */

  const latPadding =
    0.10;

  const lonPadding =
    0.15;


  const south =
    lat - latPadding;

  const north =
    lat + latPadding;

  const west =
    lon - lonPadding;

  const east =
    lon + lonPadding;


  /*
  OpenStreetMap's embed endpoint.

  This gives us a proper interactive map without
  requiring Leaflet or a map API key.
  */

  const mapUrl =
    "https://www.openstreetmap.org/export/embed.html" +
    `?bbox=${encodeURIComponent(
      `${west},${south},${east},${north}`
    )}` +
    `&layer=mapnik` +
    `&marker=${encodeURIComponent(
      `${lat},${lon}`
    )}`;


  const map =
    document.getElementById(
      "trainMap"
    );


  /*
  Only reload the iframe if the position
  has actually changed.
  */

  if (
    map.dataset.lat !== String(lat) ||
    map.dataset.lon !== String(lon)
  ) {

    map.src =
      mapUrl;


    map.dataset.lat =
      String(lat);

    map.dataset.lon =
      String(lon);
  }


  /*
  Update timestamp/details.
  */

  const seen =
    position.seen
      ? new Date(position.seen)
      : null;


  let timeText =
    "Live position received";


  if (
    seen &&
    !Number.isNaN(
      seen.getTime()
    )
  ) {

    timeText =
      `Position reported ${seen.toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }
      )}`;
  }


  document.getElementById(
    "lastUpdated"
  ).textContent =
    timeText;


  /*
  Update the full map link.

  This opens the same position in OpenStreetMap
  in a new browser tab.
  */

  const openMap =
    document.getElementById(
      "openMap"
    );


  openMap.href =
    `https://www.openstreetmap.org/?mlat=${encodeURIComponent(
      lat
    )}&mlon=${encodeURIComponent(
      lon
    )}#map=11/${encodeURIComponent(
      lat
    )}/${encodeURIComponent(
      lon
    )}`;
}



/* =========================================================
   CLOSE MAP
   ========================================================= */

function closeMap() {

  /*
  This is important because it stops the
  60-second train position requests.
  */

  stopPositionUpdates();


  selectedTrain =
    null;


  const overlay =
    document.getElementById(
      "mapOverlay"
    );


  overlay.style.display =
    "none";


  document.body.style.overflow =
    "";


  /*
  Clear the iframe so the map itself is no
  longer active.
  */

  document.getElementById(
    "trainMap"
  ).src =
    "about:blank";


  document.getElementById(
    "trainMap"
  ).dataset.lat =
    "";

  document.getElementById(
    "trainMap"
  ).dataset.lon =
    "";
}



/* =========================================================
   CLOSE BUTTON
   ========================================================= */

document
  .getElementById("closeMap")
  .addEventListener(
    "click",
    closeMap
  );


/*
Allow the Escape key to close the map.
*/

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeMap();

    }

  }
);



/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadStations().then(() => {
  loadDepartures();
});


/*
IMPORTANT:

There is deliberately NO automatic
departure-board refresh here.

The board therefore makes one Buses & Trains
departure request when the page loads.

The map makes a traini.ac request only when
you click a train.

While the map is open, position updates happen
once every 60 seconds.

Closing the map stops those requests.
*/

</script>

</body>

</html>
