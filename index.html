<html>

<head>
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="stylesheet" href="style.css">
  
<style>
        /* Container for the buttons */
        .button-row {
            display: block;
            margin-bottom: 20px;
        }
        /* Styling for the 11 small buttons */
        .platform-btn {
            width: 35px;
            height: 35px;
            margin-right: 5px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }
        /* Styling for the display board */
      .display-board {
          max-width: 800px;
          width: 100%;
          padding: 15px 20px;
          background-color: #050505;
          border: 4px solid #222;
          border-radius: 4px;
          color: #ff9900;
          font-family: 'VT323', monospace;
          font-size: 28px;
          box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 10px 30px rgba(0,0,0,0.5);
      }
    </style>
  
</head>
  
<body> 
  <div class="train-board">
  <!-- Board Header -->
  <div class="board-row header-row">
    <span class="col-time">Dep</span>
    <span class="col-dest">Destination</span>
    <span class="col-plat">Plat</span>
    <span class="col-status">Expected</span>
  </div>
  
  <!-- Train Service Row -->
  <div class="board-row train-row">
    <span class="col-time">19:42</span>
    <span class="col-dest">Sheffield</span>
    <span class="col-plat">8</span>
    <span class="col-status delayed">On Time</span>
  </div>

  <!-- Scrolling Calling Points / Details Row -->
  <div class="board-row details-row">
    <div class="scrolling-text">
      Calling at: Leicester, Loughborough, East Midlands Parkway, Long Eaton, Derby, Chesterfield and Sheffield. This train is formed of 5 coaches.
    </div>
  </div>
</div>
  
    <h3>Select Platform:</h3>
    <!-- Container where the 11 buttons will be generated -->
    <div id="buttonContainer" class="button-row"></div>

    <h3>Display Board:</h3>
    <!-- The display board showing the selected platform -->
    <div id="displayBoard" class="display-board">Platform: --</div>

  <script type="text/javascript">
    // --- CONFIGURATION ---
    var workerUrl = "https://falling-scene-1424.paul-russell.workers.dev";
    var stationCode = "SHF"; // Current target station CRS code    
    var container = document.getElementById("buttonContainer");
    var display = document.getElementById("displayBoard");

    // 1. Generate clean buttons for main Platforms 1 to 8
    container.innerHTML = "";
    for (var i = 1; i <= 8; i++) {
        var btn = document.createElement("button");
        btn.className = "platform-btn";
        btn.innerText = i;
        
        btn.onclick = function() {
            var platformNum = this.innerText;
            updateDisplay(platformNum);
        };
        
        container.appendChild(btn);
    }

    function updateDisplay(platformNumber) {
        display.innerText = "Platform " + platformNumber + " (inc. sub-platforms) - Loading...";
        fetchPlatformData(platformNumber);
    }

    function fetchPlatformData(platformNumber) {
        var xhr;
        if (typeof XMLHttpRequest !== 'undefined') {
            xhr = new XMLHttpRequest();
        } else {
            try { xhr = new ActiveXObject("MSXML2.XMLHTTP.3.0"); } catch(e) { xhr = null; }
        }

        if (!xhr) {
            display.innerText = "Error: AJAX not supported.";
            return;
        }

        var target = workerUrl + "?type=train&station=" + encodeURIComponent(stationCode);
        xhr.open("GET", target, true);
        
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                // Safeguard against upstream 502/500 errors crashing your interface
                if (xhr.status === 200) {
                    processTrainData(xhr.responseText, platformNumber);
                } else {
                    display.innerText = "Upstream Service Error (HTTP " + xhr.status + "). Please try again.";
                }
            }
        };
        
        xhr.send(null);
    }

    function processTrainData(jsonText, platformNumber) {
        try {
            var responseData = (typeof JSON !== 'undefined') ? JSON.parse(jsonText) : eval('(' + jsonText + ')');
            var trains = responseData.departures || responseData.services || responseData; 
            
            var outputHtml = "<b>Platform " + platformNumber + " Next Trains:</b><br>";
            var matchedTrains = [];

if (trains && trains.length > 0) {
    for (var i = 0; i < trains.length; i++) {

        var train = trains[i];

        var apiPlatform = train.platform
            ? String(train.platform).toLowerCase()
            : "";

        var targetPrefix = String(platformNumber).toLowerCase();

        // Match 2, 2A, 2B, 2C etc.
        if (apiPlatform === targetPrefix ||
            apiPlatform.indexOf(targetPrefix) === 0) {

            matchedTrains.push(train);
        }
    }
}

            // Render a maximum of 3 trains
            var limit = matchedTrains.length > 3 ? 3 : matchedTrains.length;

            if (limit > 0) {
                for (var j = 0; j < limit; j++) {
                    var t = matchedTrains[j];
                    
                    // Parse standard UK Buses & Trains API response payload format safely
                    var rawTime = t.scheduled || t.expected || t.std || "";
                    var formattedTime = "00:00";
                    
                    // If time is returned as ISO '2026-09-30T14:30:00', slice out the HH:MM
                    if (rawTime.length >= 16 && rawTime.indexOf("T") !== -1) {
                        formattedTime = rawTime.substring(rawTime.indexOf("T") + 1, rawTime.indexOf("T") + 6);
                    } else if (rawTime.length > 0) {
                        formattedTime = rawTime;
                    }
                                   
                    var outputHtml =
    '<div class="train-board">' +
    '<div class="board-row header-row">' +
    '<span class="col-time">DEP</span>' +
    '<span class="col-dest">DESTINATION</span>' +
    '<span class="col-plat">PLAT</span>' +
    '<span class="col-status">EXPECTED</span>' +
    '</div>';

for (var j = 0; j < limit; j++) {

    var t = matchedTrains[j];

    var depTime = t.scheduled || "";
    var dest = t.destination || "Unknown";
    var plat = t.platform || "";

    var status =
        t.is_cancelled
            ? "Cancelled"
            : (t.expected || "On Time");

    outputHtml +=
        '<div class="board-row train-row">' +
            '<span class="col-time">' + depTime + '</span>' +
            '<span class="col-dest">' + dest.toUpperCase() + '</span>' +
            '<span class="col-plat">' + plat + '</span>' +
            '<span class="col-status">' + status + '</span>' +
        '</div>';
}

outputHtml += '</div>';
                }
            } else {
                outputHtml += "No upcoming departures found for this platform.";
            }

            display.innerHTML = outputHtml;

        } catch (e) {
            display.innerText = "Error reading timetable data layout.";
        }
    }
</script>

</body>
</html>
