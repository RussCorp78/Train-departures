<html>

<head>
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="stylesheet" href="style.css">
  
<style>
        /* Container for the buttons */
        .button-row {
            display: block;
            margin-bottom: 20px;
        }
        /* Styling for the 11 small buttons */
        .platform-btn {
            width: 35px;
            height: 35px;
            margin-right: 5px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }
        /* Styling for the display board */
        .display-board {
            width: 300px;
            padding: 15px;
            background-color: #111;
            color: #ff9900; /* Classic dot-matrix amber color */
            font-family: monospace;
            font-size: 20px;
            border-radius: 4px;
            border: 2px solid #333;
        }
    </style>
  
</head>
  
<body> 
  <div class="train-board">
  <!-- Board Header -->
  <div class="board-row header-row">
    <span class="col-time">Dep</span>
    <span class="col-dest">Destination</span>
    <span class="col-plat">Plat</span>
    <span class="col-status">Expected</span>
  </div>
  
  <!-- Train Service Row -->
  <div class="board-row train-row">
    <span class="col-time">19:42</span>
    <span class="col-dest">Sheffield</span>
    <span class="col-plat">8</span>
    <span class="col-status delayed">On Time</span>
  </div>

  <!-- Scrolling Calling Points / Details Row -->
  <div class="board-row details-row">
    <div class="scrolling-text">
      Calling at: Leicester, Loughborough, East Midlands Parkway, Long Eaton, Derby, Chesterfield and Sheffield. This train is formed of 5 coaches.
    </div>
  </div>
</div>
  
    <h3>Select Platform:</h3>
    <!-- Container where the 11 buttons will be generated -->
    <div id="buttonContainer" class="button-row"></div>

    <h3>Display Board:</h3>
    <!-- The display board showing the selected platform -->
    <div id="displayBoard" class="display-board">Platform: --</div>

  <script type="text/javascript">
    // --- CONFIGURATION ---
    var workerUrl = "https://falling-scene-1424.paul-russell.workers.dev"; // Your Cloudflare Worker URL
    var stationCode = "SFH"; // Change to your target station CRS code (e.g., PAD, MAN)
    
    var container = document.getElementById("buttonContainer");
    var display = document.getElementById("displayBoard");

    // 1. Explicitly list your specific station platforms layout
    var platforms = [
        "1a", "1b", 
        "2a", "2b", "2c", 
        "3a", "3b", 
        "4a", "4b", 
        "5a", "5b", 
        "6a", "6b", 
        "7a", "7b", 
        "8a", "8b"
    ];

    // Clear any previous static buttons and dynamically generate the new platform variations
    container.innerHTML = "";
    for (var i = 0; i < platforms.length; i++) {
        var btn = document.createElement("button");
        btn.className = "platform-btn";
        btn.innerText = platforms[i];
        
        btn.onclick = function() {
            var platformNum = this.innerText;
            updateDisplay(platformNum);
        };
        
        container.appendChild(btn);
    }

    function updateDisplay(platformNumber) {
        display.innerText = "Platform " + platformNumber + " - Loading...";
        fetchPlatformData(platformNumber);
    }

    function fetchPlatformData(platformNumber) {
        var xhr;
        if (typeof XMLHttpRequest !== 'undefined') {
            xhr = new XMLHttpRequest();
        } else {
            try { xhr = new ActiveXObject("MSXML2.XMLHTTP.3.0"); } catch(e) { xhr = null; }
        }

        if (!xhr) {
            display.innerText = "Error: AJAX not supported in this environment.";
            return;
        }

        var target = workerUrl + "?type=train&station=" + encodeURIComponent(stationCode);
        xhr.open("GET", target, true);
        
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    processTrainData(xhr.responseText, platformNumber);
                } else {
                    display.innerText = "Error loading data (Status: " + xhr.status + ")";
                }
            }
        };
        
        xhr.send(null);
    }

    function processTrainData(jsonText, platformNumber) {
        try {
            var responseData = (typeof JSON !== 'undefined') ? JSON.parse(jsonText) : eval('(' + jsonText + ')');
            
            // Handle variations in root data property wrappers
            var trains = responseData.departures || responseData.services || responseData; 
            var outputHtml = "<b>Platform " + platformNumber + " Departures:</b><br>";
            var foundAny = false;

            if (trains && trains.length > 0) {
                for (var i = 0; i < trains.length; i++) {
                    var train = trains[i];
                    
                    // Match platform case-insensitively (e.g., '1a' matches '1A')
                    var apiPlatform = train.platform ? String(train.platform).toLowerCase() : "";
                    var targetPlatform = String(platformNumber).toLowerCase();

                    if (apiPlatform === targetPlatform) {
                        foundAny = true;
                        
                        // Fix for 00:00 time field: Exhaustively check all UK departure API key schemas
                        var time = train.std || 
                                   train.aimed_departure_time || 
                                   train.origin_departure_time || 
                                   train.expected_departure_time || 
                                   "00:00";
                                   
                        var dest = train.destination_name || train.destination || "Unknown Destination";
                        var status = train.etd || train.status || "On Time";
                        
                        outputHtml += time + " to " + dest + " (" + status + ")<br>";
                    }
                }
            }

            if (!foundAny) {
                outputHtml += "No upcoming departures scheduled.";
            }

            display.innerHTML = outputHtml;

        } catch (e) {
            display.innerText = "Error processing train timetables.";
        }
    }
</script>


  <a href="departures.html"> Sheffield Departures </a>

</body>
</html>
